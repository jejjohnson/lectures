project:
  type: website
  output-dir: _site
  execute-dir: project # run code cells from repo root so `src/lectures` imports resolve
  # Execute notebooks/code once and cache; CI re-renders only what changed.
  preview:
    port: 4848

execute:
  freeze: auto # cache computed figures under _freeze/ so CI stays fast & reproducible
  warning: false

bibliography: references.bib

