[project]
name = "lectures"
version = "0.1.1"
description = "Probabilistic ML for finance — lecture notes, slides, and demos"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectures"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pre-commit>=3.7",
    # Data-generation only (scripts/download_*.py); not needed at render time —
    # the site builds from the committed CSVs in data/processed/.
    "yfinance>=0.2",
    "folktables>=0.0.12",
    "scikit-learn>=1.3",
]
lint = [
    "ruff>=0.9",
]
typecheck = [
    "ty>=0.0.1a6",
]
docs = [
    # Quarto itself is a binary (installed via pixi/conda or quarto.org).
    # These are the Python-side execution deps it needs to run code cells.
    "jupyter>=1.0",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Teaching-code style: einx spells out the axes of every linear-algebra op,
    # jaxtyping documents array shapes in function signatures (numpy-compatible).
    "einx>=0.3",
    "jaxtyping>=0.2",
    # The author's RBIG (Gaussianization) package — NumPy/scikit-learn based, so
    # it renders the topic figures without the heavy JAX/Keras demo libraries.
    "rbig",
    # Keras (JAX CPU backend) renders the neural-network uncertainty figures —
    # same stack as keras-fairkl in Module 4, kept CPU-only so docs CI stays light.
    "keras>=3.5",
    "jax>=0.4.30",
    # The author's fair kernel learning package — renders the Module 4 figures
    # with the real penalty implementation, not a stand-in.
    "fairkl",
]

[tool.uv.sources]
rbig = { git = "https://github.com/jejjohnson/rbig.git" }
fairkl = { git = "https://github.com/jejjohnson/keras-fairkl.git" }

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["notebooks/", "marimo_notebooks/", ".plans/", "_freeze/", "_site/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["E501", "I001", "B018"]
"marimo_notebooks/**/*.py" = ["E501", "I001", "B018"]
"courses/**/demos/**/*.py" = ["E501", "I001", "B018"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/lectures --cov-report=term-missing --cov-report=xml:coverage.xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
xfail_strict = true

[tool.coverage.run]
source = ["src/lectures"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
