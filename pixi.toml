[project]
name = "lectures"
version = "0.1.0"
description = "Probabilistic ML for finance — lecture notes, slides, and demos"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
numpy = "*"
scipy = "*"
matplotlib = "*"
xarray = "*"
netcdf4 = "*"
dvc = ">=3"
hydra-core = ">=1.3"

[pypi-dependencies]
lectures = { path = ".", editable = true }
hydra-zen = ">=0.13"
omegaconf = ">=2.3"

[feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pre-commit = ">=3.7"
ruff = ">=0.9"
jupytext = ">=1.16"

[feature.dev.pypi-dependencies]
ty = ">=0.0.1a6"

# --- Docs/site/slides: Quarto (renders the website AND the reveal.js decks) ---
[feature.docs.dependencies]
quarto = ">=1.5"
jupyter = "*"        # Quarto executes Python cells through the Jupyter kernel
ipykernel = ">=6.29"
nbclient = "*"

# RBIG (Gaussianization) is NumPy/scikit-learn based — light enough to render
# the topic figures with the author's real package, not a stand-in.
[feature.docs.pypi-dependencies]
rbig = { git = "https://github.com/jejjohnson/rbig.git" }

# --- Opt-in env for the live code demos (heavy: jax/torch/tf land here) ---
# Kept out of the default + docs envs so `pixi install` and the docs CI stay light.
[feature.demos.pypi-dependencies]
rbig = { git = "https://github.com/jejjohnson/rbig.git" }
gauss_flows = { git = "https://github.com/jejjohnson/gauss_flows.git" }
pyrox = { git = "https://github.com/jejjohnson/pyrox.git" }
fairkl = { git = "https://github.com/jejjohnson/keras-fairkl.git" }

[feature.jupyterlab.dependencies]
jupyterlab = ">=4"
ipykernel = ">=6.29"
jupyterlab-git = "*"
ipywidgets = ">=8"

[environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
jupyterlab = { features = ["dev", "jupyterlab"], solve-group = "default" }
# demos solves separately — its heavy deps must not constrain the others.
demos = { features = ["dev", "demos"] }

[tasks]
test = "pytest -v"
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check src/lectures"
precommit = "pre-commit run --all-files"
notebooks-to-ipynb = "python scripts/convert_notebooks.py --verbose"

[feature.docs.tasks]
preview = "quarto preview"
render = "quarto render"
publish = "quarto publish gh-pages --no-prompt"

[feature.jupyterlab.tasks]
lab = "jupyter lab"
